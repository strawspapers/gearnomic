<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gearnomic Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f1ec;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 2rem;
      width: 100%;
      max-width: 440px;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; color: #1a1a1a; }
    .sub { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
    label { display: block; font-size: 13px; font-weight: 500; color: #444; margin-bottom: 5px; }
    input, select {
      width: 100%; padding: 9px 12px; border: 1px solid #ddd;
      border-radius: 7px; font-size: 14px; font-family: inherit;
      outline: none; margin-bottom: 1rem; color: #1a1a1a;
    }
    input:focus, select:focus { border-color: #2A4032; }
    input[type="password"] { font-family: monospace; letter-spacing: 1px; }
    .btn {
      width: 100%; padding: 10px; border: none; border-radius: 7px;
      font-size: 14px; font-weight: 500; cursor: pointer;
      font-family: inherit; transition: opacity .15s;
    }
    .btn:hover { opacity: .88; }
    .btn-primary   { background: #2A4032; color: #fff; }
    .btn-danger    { background: #c0392b; color: #fff; margin-top: 8px; }
    .result {
      margin-top: 1rem; padding: 10px 14px; border-radius: 7px;
      font-size: 13px; display: none; line-height: 1.5;
    }
    .result.ok    { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }
    .result.err   { background: #fdedec; color: #c0392b; border: 1px solid #f5b7b1; }
    .divider { border: none; border-top: 1px solid #eee; margin: 1.5rem 0; }
    .warn { font-size: 12px; color: #aaa; margin-top: 1rem; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⛰ Gearnomic Admin</h1>
    <p class="sub">Grant or revoke Supporter access by email</p>

    <label>Admin secret</label>
    <input type="password" id="secret" placeholder="Your ADMIN_SECRET value">

    <label>Edge Function URL</label>
    <input type="text" id="fn-url"
      placeholder="https://YOUR_PROJECT.supabase.co/functions/v1/admin-grant-supporter"
      value="">

    <hr class="divider">

    <label>User email</label>
    <input type="email" id="email" placeholder="friend@example.com">

    <button class="btn btn-primary" onclick="grant()">✓ Grant Supporter access</button>
    <button class="btn btn-danger"  onclick="revoke()">✕ Revoke Supporter access</button>

    <div id="result" class="result"></div>

    <p class="warn">This page should not be committed to a public repo.<br>Keep it local or behind a private URL.</p>
  </div>

  <script>
    // Pre-fill URL from localStorage so you don't retype it every time
    const savedUrl = localStorage.getItem('gn_admin_fn_url');
    if (savedUrl) document.getElementById('fn-url').value = savedUrl;

    async function callFn(grant) {
      const secret = document.getElementById('secret').value.trim();
      const fnUrl  = document.getElementById('fn-url').value.trim();
      const email  = document.getElementById('email').value.trim();
      const result = document.getElementById('result');

      result.style.display = 'none';

      if (!secret) return show('Enter your ADMIN_SECRET.', false);
      if (!fnUrl)  return show('Enter the Edge Function URL.', false);
      if (!email)  return show('Enter a user email.', false);

      localStorage.setItem('gn_admin_fn_url', fnUrl);

      try {
        const res = await fetch(fnUrl, {
          method:  'POST',
          headers: {
            'Content-Type':  'application/json',
            'Authorization': `Bearer ${secret}`,
          },
          body: JSON.stringify({ email, grant }),
        });
        const data = await res.json();
        if (res.ok) show(data.message, true);
        else show(data.error || 'Request failed.', false);
      } catch (e) {
        show('Network error — check the Function URL and that the function is deployed.', false);
      }
    }

    function grant()  { callFn(true);  }
    function revoke() { callFn(false); }

    function show(msg, ok) {
      const el = document.getElementById('result');
      el.textContent = msg;
      el.className = 'result ' + (ok ? 'ok' : 'err');
      el.style.display = 'block';
    }
  </script>
</body>
</html>
