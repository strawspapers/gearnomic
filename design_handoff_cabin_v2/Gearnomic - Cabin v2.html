<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gearnomic — Cabin v2 design reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; background: #E8E7E2; }
    .stack { display: flex; flex-direction: column; gap: 32px; padding: 32px; align-items: center; }
    .frame { box-shadow: 0 1px 0 rgba(0,0,0,0.08); }
    .frame-label { font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #555; margin-bottom: 8px; align-self: flex-start; padding-left: 4px; }
    .frame-wrap { display: flex; flex-direction: column; align-items: flex-start; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="cabin-v2.jsx"></script>

  <script type="text/babel" data-presets="react">
    const Frame = ({label, children}) => (
      <div className="frame-wrap">
        <div className="frame-label">{label}</div>
        <div className="frame">{children}</div>
      </div>
    );
    const App = () => (
      <div className="stack">
        <Frame label="1 — Trips landing"><Cab2TripsLanding/></Frame>
        <Frame label="2 — Food → My plans → Sawtooth (meal plan detail)"><Cab2Meals/></Frame>
        <Frame label="3 — Gear → My closet (inventory)"><Cab2Gear/></Frame>
      </div>
    );
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
